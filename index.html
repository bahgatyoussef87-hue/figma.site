<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Amazon Review Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div><strong>ReviewIQ</strong><span>ML SENTIMENT LAB</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="backend-dot"><i></i><span id="backendStatus">Demo mode</span></div>
      <small>Python API ready</small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">AMAZON CUSTOMER REVIEWS</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh data">↻</button>
        <div class="avatar">YB</div>
      </div>
    </header>

    <section id="page" class="page"></section>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
